<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 548" width="980" height="548"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="0" y="0" width="980" height="548" fill="#faf7f2"/><text x="490.0" y="42" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#262220">Table 2.5 — validation scenarios</text><rect x="20" y="70" width="940" height="48" fill="#262220"/><text x="32" y="100" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Scenario</text><text x="252" y="100" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Expected</text><text x="582" y="100" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">What happened</text><rect x="20" y="118" width="940" height="80" fill="#ffffff" stroke="#c9bfae"/><text x="32" y="144" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Valid target</text><text x="32" y="164" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">address</text><text x="252" y="144" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Mined + RequestCreated</text><text x="252" y="164" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">emitted</text><text x="582" y="144" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">w3.is_address gates input;</text><text x="582" y="164" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">malformed never reaches chain</text><rect x="20" y="198" width="940" height="80" fill="#f5efe6" stroke="#c9bfae"/><text x="32" y="224" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Non-target sees</text><text x="32" y="244" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">event</text><text x="252" y="224" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Stays silent</text><text x="582" y="224" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Target-vs-own-address compare</text><text x="582" y="244" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">skips the log</text><rect x="20" y="278" width="940" height="80" fill="#ffffff" stroke="#c9bfae"/><text x="32" y="304" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">SQL: missing</text><text x="32" y="324" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">table</text><text x="252" y="304" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Local fail; node</text><text x="252" y="324" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">keeps running</text><text x="582" y="304" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">handle_query returns error string;</text><text x="582" y="324" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">listener continues</text><rect x="20" y="358" width="940" height="80" fill="#f5efe6" stroke="#c9bfae"/><text x="32" y="384" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Gas estimate</text><text x="32" y="404" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">too low</text><text x="252" y="384" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Tx must not drop</text><text x="252" y="404" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">for gas</text><text x="582" y="384" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Estimate + fixed margin sent,</text><text x="582" y="404" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">not the bare estimate</text><rect x="20" y="438" width="940" height="80" fill="#ffffff" stroke="#c9bfae"/><text x="32" y="464" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Second response,</text><text x="32" y="484" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">same id</text><text x="252" y="464" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">Must be rejected</text><text x="582" y="464" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">require(!fulfilled) reverts</text><text x="582" y="484" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#262220">the transaction</text></svg>