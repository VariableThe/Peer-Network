<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="0" y="0" width="1000" height="510" fill="#faf7f2"/><text x="500.0" y="42" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="26" font-weight="bold" fill="#262220">On-chain vs off-chain — the core split (§1.1)</text><rect x="30" y="80" width="445" height="330" rx="12" fill="#fdf1e3" stroke="#b3541e" stroke-width="2.5"/><text x="252" y="118" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#b3541e">ON CHAIN — DataTransfer.sol</text><text x="55" y="160" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• request string: target + dbQuery</text><text x="55" y="202" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• response string: serialized rows (JSON)</text><text x="55" y="244" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• fulfilled flag + one-response guard</text><text x="55" y="286" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• RequestCreated / ResponseSent events</text><text x="252" y="372" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" font-style="italic" fill="#b3541e">permanent · auditable · gas-priced</text><rect x="525" y="80" width="445" height="330" rx="12" fill="#e9effe" stroke="#2b4fa3" stroke-width="2.5"/><text x="747" y="118" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#2b4fa3">OFF CHAIN — peers + SQLite</text><text x="550" y="160" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• SQL text, executed locally</text><text x="550" y="202" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• actual rows (peer1 / peer2 / peer3.db)</text><text x="550" y="244" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• table schema: key, value, model, time</text><text x="550" y="286" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• signing, receipts, retries in peerz.py</text><text x="747" y="372" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" font-style="italic" fill="#2b4fa3">cheap · flexible · private</text><text x="500" y="465" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#b3261e">✗ Dropped: storing the schema in the contract — slow queries, gas cost, no payoff.</text></svg>