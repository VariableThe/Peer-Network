<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="0" y="0" width="1000" height="510" fill="#faf7f2"/><text x="500.0" y="42" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="26" font-weight="bold" fill="#262220">Prototype trust boundaries (§2.9)</text><rect x="30" y="90" width="445" height="320" rx="12" fill="#e6f4ea" stroke="#1e7e34" stroke-width="2.5"/><text x="252" y="128" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#1e7e34">TRACE — what the build gives</text><text x="55" y="172" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• every request + response is a visible tx</text><text x="55" y="224" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• one-response guard: require(!fulfilled)</text><text x="55" y="276" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• target indexed in RequestCreated</text><text x="55" y="328" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• receipts checked, not console prints</text><rect x="525" y="90" width="445" height="320" rx="12" fill="#fdecea" stroke="#b3261e" stroke-width="2.5"/><text x="747" y="128" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#b3261e">HARDENING — still missing</text><text x="550" y="172" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• require(msg.sender == target) in respond</text><text x="550" y="224" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• dbQuery allowlist — approved queries only</text><text x="550" y="276" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• encrypt / hash sensitive responses</text><text x="550" y="328" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">• peer authentication + access control</text><text x="500" y="465" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#262220">Responses are plaintext; the client runs any SQL it receives — peers assumed honest.</text></svg>